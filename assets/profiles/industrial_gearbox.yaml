asset_type: "industrial_gearbox"
criticality_class: "B"
load_variable: "input_torque"
description: "Helical parallel shaft reducer drive for kiln agitation conveyor"

sensors:
  - name: "gear_mesh_vibration"
    unit: "mm/s"
    normal_range: [1.2, 4.8]
    sampling_hz: 20.0
    description: "High-frequency accelerometer on intermediate pinion bearing housing"
  - name: "oil_sump_temp"
    unit: "deg_C"
    normal_range: [40.0, 78.0]
    sampling_hz: 0.1
    description: "Gearbox lower reservoir oil temperature"
  - name: "input_torque"
    unit: "kNm"
    normal_range: [2.5, 14.0]
    sampling_hz: 1.0
    description: "Shaft telemetry torque measuring operational drive load"
  - name: "shaft_speed"
    unit: "rpm"
    normal_range: [720.0, 750.0]
    sampling_hz: 1.0
    description: "Input pinon rotational speed"

derived_features:
  - "mesh_harmonic_energy"
  - "torque_normalized_vibration"

failure_modes:
  - name: "gear_tooth_pitting"
    signature_hints:
      - "Rise in gear_mesh_vibration with sideband modulation at shaft_speed"
      - "Elevated tooth mesh harmonics under medium to high input_torque"
    severity: "HIGH"
    primary_sensor: "gear_mesh_vibration"
    description: "Sub-surface fatigue micro-spalling on pitch line of helical gears."
  - name: "bearing_cage_failure"
    signature_hints:
      - "Impact peaks in vibration accompanied by sudden jump in oil_sump_temp"
    severity: "CRITICAL"
    primary_sensor: "gear_mesh_vibration"
    description: "Retainer ring cracking leading to roller skewing and shaft lockup."

manual_references:
  - "SOP-GBX-02: Helical Reducer Backlash Measurement and End-Play Tolerance"
  - "MAN-SEW-EURODRIVE: Industrial Gear Unit Series MC Servicing Manual"
